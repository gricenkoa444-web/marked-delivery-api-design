openapi: 3.0.3
info:
  title: API приемки маркированной поставки
  version: 0.1.0
servers:
  - url: https://api.example.com/v1
    description: Учебный сервер (вымышленный)
paths:
  /deliveries/{deliveryId}/acceptance:
    post:
      summary: Подтвердить приёмку поставки
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
     responses:
       '201':
         description: Приемка зафиксирована
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT  
