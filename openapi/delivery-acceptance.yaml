openapi: 3.0.3
info:
  title: API приёмки маркированной поставки
  version: 0.1.0
servers:
  - url: https://api.example.com/v1
    description: Учебный сервер (вымышленный)
paths:
  /deliveries/{deliveryId}/acceptance:
    post:
      summary: Подтвердить приёмку поставки
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceRequest'
      responses:
        '201':
          description: Приёмка зафиксирована
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AcceptanceRequest:
      type: object
      required: [acceptedAt, items]
      properties:
        acceptedAt:
          type: string
          format: date-time
          description: Дата и время фактической приёмки (UTC)
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AcceptedItem'
        comment:
          type: string
          maxLength: 500
          description: Комментарий; при расхождении количества сервер требует его заполнить
    AcceptedItem:
      type: object
      required: [gtin, acceptedQuantity]
      properties:
        gtin:
          type: string
          pattern: '^[0-9]{14}$'
          description: Код товара GTIN, 14 цифр
        acceptedQuantity:
          type: integer
          minimum: 0
          description: Фактически принятое количество  
